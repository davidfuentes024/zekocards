<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#FDFFFC" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0B1626" media="(prefers-color-scheme: dark)" />
		<meta name="color-scheme" content="light dark" />
		<meta
			name="description"
			content="Zekocards — a free, offline-friendly card game for learning hiragana, katakana and kanji through relentless repetition."
		/>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<script>
			try {
				var t = localStorage.getItem('zekocards:theme');
				if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
